name: Build Neon Runner

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Verify executable
        run: |
          test -x build/neon_runner
          file build/neon_runner

      - name: Package artifact
        run: |
          rm -rf package
          mkdir -p package/neon-runner/assets/generated
          cp build/neon_runner package/neon-runner/
          cp README.md package/neon-runner/
          touch package/neon-runner/assets/generated/.gitkeep
          tar -czf neon-runner-linux-x64.tar.gz -C package neon-runner
          test -s neon-runner-linux-x64.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-runner-linux-x64
          path: neon-runner-linux-x64.tar.gz
          if-no-files-found: error
